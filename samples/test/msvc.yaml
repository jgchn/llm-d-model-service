apiVersion: llm-d.ai/v1alpha1
kind: ModelService
metadata:
  name: busybox
spec:
  decoupleScaling: false

  baseConfigMapRef:
    name: basic-basic-conf

  routing: 
    modelName: llama-2075
    ports:
    - name: inport
      port: 80
    - name: outport
      port: 9376
    gatewayRefs:
    - name: inference-gateway-name
      port: 1112

  modelArtifacts:
    uri: hf://facebook/opt-125m

  # describe decode pods
  prefill:
    replicas: 1
    containers:
    - name: "llm"
      image: busybox
      args: 
      - "sleep"
      - "3600"
      # args:
      # - "{{ .ModelName }}"

