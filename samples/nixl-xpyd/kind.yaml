# Source: llm-d/templates/modelservice/presets/basic-sim-preset.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: basic
data:
  decodeDeployment: |
    apiVersion: apps/v1
    kind: Deployment
    spec:
      template:
        spec:
          tolerations:
            - effect: NoSchedule
              key: nvidia.com/gpu
              operator: Exists
          initContainers:
            - name: routing-proxy
              image: ghcr.io/llm-d/llm-d-routing-sidecar:0.0.6
              securityContext:
                securityContext:
                  allowPrivilegeEscalation: false
                  capabilities:
                    drop:
                    - MKNOD
              args:
                - "--port=8000"
                - "--vllm-port=8001"
              ports:
                - containerPort: 8000
                  protocol: TCP
              restartPolicy: Always
              imagePullPolicy: IfNotPresent
          containers:
            - name: vllm
              image: ghcr.io/llm-d/llm-d-inference-sim:0.0.4
              imagePullPolicy: IfNotPresent
              securityContext:
                capabilities:
                  drop:
                    - MKNOD
                allowPrivilegeEscalation: false
              args:
                - "--port"
                - "8001"
              env:
                - name: HOME
                  value: /home
              volumeMounts:
                - name: home
                  mountPath: /home
              ports:
                - containerPort: 5557
                  protocol: TCP
          volumes:
            - name: home
              emptyDir: {}

  prefillDeployment: |
    apiVersion: apps/v1
    kind: Deployment
    spec:
      template:
        spec:
          tolerations:
            - effect: NoSchedule
              key: nvidia.com/gpu
              operator: Exists
          containers:
            - name: vllm
              image: ghcr.io/llm-d/llm-d-inference-sim:0.0.4
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
              args:
                - "--port"
                - "8000"
              env:
                - name: HOME
                  value: /home
              volumeMounts:
                - name: home
                  mountPath: /home
              ports:
                - containerPort: 5557
                  protocol: TCP
          volumes:
            - name: home
              emptyDir: {}

  decodeService: |
    apiVersion: v1
    kind: Service
    metadata:
      labels:
        llmd.ai/gather-metrics: "true"
    spec:
      clusterIP: None
      ports:
      - name: vllm
        port: 8000
        protocol: TCP

  prefillService: |
    apiVersion: v1
    kind: Service
    metadata:
      labels:
        llmd.ai/gather-metrics: "true"
    spec:
      clusterIP: None
      ports:
      - name: vllm
        port: 8000
        protocol: TCP

  eppService: |
    apiVersion: v1
    kind: Service
    metadata:
      labels:
        app.kubernetes.io/gateway: llm-d-inference-gateway
        llmd.ai/gather-metrics: "true"
    spec:
      ports:
        - port: 9002
          protocol: TCP
          name: grpc
        - port: 9003
          protocol: TCP
          name: grpc-health
        - port: 9090
          protocol: TCP
          name: metrics
      type: NodePort
      selector:
        app.kubernetes.io/gateway: llm-d-inference-gateway

  eppDeployment: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      labels:
        app.kubernetes.io/gateway: llm-d-inference-gateway
    spec:
      selector:
        matchLabels:
          app.kubernetes.io/gateway: llm-d-inference-gateway
      template:
        metadata:
          labels:
            app.kubernetes.io/gateway: llm-d-inference-gateway
        spec:
          containers:
            - args:
                - --poolName
                - "{{ .InferencePoolName }}"
                - --poolNamespace
                - "{{ .ModelServiceNamespace }}"
                - -v
                - "4"
                - --zap-encoder
                - json
                - --grpcPort
                - "9002"
                - --grpcHealthPort
                - "9003"
              env:
              
              - name: ENABLE_KVCACHE_AWARE_SCORER
                value: false
              - name: ENABLE_LOAD_AWARE_SCORER
                value: true
              - name: ENABLE_PREFIX_AWARE_SCORER
                value: true
              - name: ENABLE_SESSION_AWARE_SCORER
                value: false
              - name: KVCACHE_AWARE_SCORER_WEIGHT
                value: 1
              - name: KVCACHE_INDEXER_REDIS_ADDR
                value: 
              - name: LOAD_AWARE_SCORER_WEIGHT
                value: 1
              - name: PD_ENABLED
                value: false
              - name: PD_PROMPT_LEN_THRESHOLD
                value: 10
              - name: PREFILL_ENABLE_KVCACHE_AWARE_SCORER
                value: false
              - name: PREFILL_ENABLE_LOAD_AWARE_SCORER
                value: false
              - name: PREFILL_ENABLE_PREFIX_AWARE_SCORER
                value: false
              - name: PREFILL_ENABLE_SESSION_AWARE_SCORER
                value: false
              - name: PREFILL_KVCACHE_AWARE_SCORER_WEIGHT
                value: 1
              - name: PREFILL_KVCACHE_INDEXER_REDIS_ADDR
                value: 
              - name: PREFILL_LOAD_AWARE_SCORER_WEIGHT
                value: 1
              - name: PREFILL_PREFIX_AWARE_SCORER_WEIGHT
                value: 1
              - name: PREFILL_SESSION_AWARE_SCORER_WEIGHT
                value: 1
              - name: PREFIX_AWARE_SCORER_WEIGHT
                value: 2
              - name: SESSION_AWARE_SCORER_WEIGHT
                value: 1
              image: ghcr.io/llm-d/llm-d-inference-scheduler:0.0.3
              imagePullPolicy: Always
              # resources:
              #   requests:
              #     cpu: 256m
              #     memory: 128Mi
              # livenessProbe:
              #   failureThreshold: 3
              #   grpc:
              #     port: 9003
              #     service: "envoy.service.ext_proc.v3.ExternalProcessor"
              #   initialDelaySeconds: 5
              #   periodSeconds: 10
              #   successThreshold: 1
              #   timeoutSeconds: 1
              # readinessProbe:
              #   failureThreshold: 3
              #   grpc:
              #     port: 9003
              #     service: "envoy.service.ext_proc.v3.ExternalProcessor"
              #   initialDelaySeconds: 5
              #   periodSeconds: 10
              #   successThreshold: 1
              #   timeoutSeconds: 1
              name: epp
              ports:
                - name: grpc
                  containerPort: 9002
                  protocol: TCP
                - name: grpc-health
                  containerPort: 9003
                  protocol: TCP
                - name: metrics
                  containerPort: 9090
                  protocol: TCP

  inferencePool: |
    apiVersion: inference.networking.x-k8s.io/v1alpha2
    kind: InferencePool
    spec:
      targetPortNumber: 8000

  inferenceModel: |
    apiVersion: inference.networking.x-k8s.io/v1alpha2
    kind: InferenceModel
  
  httpRoute: |
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    spec:
      rules:
      - backendRefs:
        - group: inference.networking.x-k8s.io
          kind: InferencePool
          name: {{ .InferencePoolName }}
          port: {{ "app_port" | getPort }}
        matches:
        - headers:
          - name: x-model-name
            type: Exact
            value: {{ .HFModelName }}
          path:
            type: PathPrefix
            value: /

--- 
# Source: llm-d/templates/inference-gateway/gateway.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: llm-d-inference-gateway
  annotations:
    networking.istio.io/service-type: ClusterIP
spec:
  gatewayClassName: "istio"
  listeners:
    - name: default
      port: 80
      protocol: HTTP

