apiVersion: llm-d.ai/v1alpha1
kind: ModelService
metadata:
  name: granite-instruct
spec:
  decoupleScaling: false

  baseConfigMapRef:
    name: universal-base-config-hf

  routing: 
    # This is the model name for the OpenAI request
    modelName: ibm-granite/granite-3.3-2b-instruct
    ports:
    - name: app_port
      port: 8000
    - name: internal_port
      port: 8200
    gatewayRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: inference-gateway

  modelArtifacts:
    # When specfying the URI with `hf` prefix, the <repo-id>/<model-id> string
    # is extracted and exposed as a template variable that can be used as {{ .HFModelName }}
    uri: hf://ibm-granite/granite-3.3-2b-instruct

  # decode pods
  decode:
    replicas: 1
    containers:
    - name: "vllm"
      args:
        - "{{ .HFModelName }}"